plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.simemu.spoof'
    compileSdk 34

    defaultConfig {
        applicationId 'com.simemu.spoof'
        minSdk 29          // Android 10
        targetSdk 34       // Android 14 SDK; runtime-tested through Android 16
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false          // keep hook method names intact for reflection
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Xposed API — compileOnly: it is provided by the LSPosed framework at runtime,
    // and must NOT be bundled into the APK or hooks will fail to bind.
    //
    // Preferred (when api.xposed.info is reachable):
    //     compileOnly 'de.robv.android.xposed:api:82'
    // Because that host is frequently down, we vendor a compile-only stub jar in
    // app/libs that exposes the exact API symbols this module uses. It is never
    // packaged (compileOnly), so the real LSPosed classes are used at runtime.
    compileOnly fileTree(dir: 'libs', include: ['xposed-api-82-stub.jar'])

    // Reflection helper for Android hidden/greylisted APIs on API 28+ (bypasses the
    // non-SDK interface restrictions so we can touch SubscriptionInfo constructors etc.).
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Kotlin JSON serialization for the profile config format.
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
}
